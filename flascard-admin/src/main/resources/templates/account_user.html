<html>
    <head>
        <title>Account User</title>
        <link rel="stylesheet" th:href="@{/bootstrap/css/bootstrap.min.css}">
      
        <link rel="stylesheet" th:href="@{/custom/css/popup_create.css}">
    
    </head>

    <body>
       
        <div th:insert="~{fragments/my_template :: top_menu}"></div>

      
        <div th:insert="~{fragments/my_template :: search_add}"></div>
    
            <div id="popup" class="popup">
                <form th:action="@{/account_user/create}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username:</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password:</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="mb-3">
                        <label for="authority" class="form-label">Authority:</label>
                        <select id="authority" class="form-control" name="authority">
                            <option value="ROLE_USER" selected>ROLE_USER</option>
                            <option value="ROLE_ADMIN">ROLE_ADMIN</option>
                        </select>                    
                        <!-- <input type="text" class="form-control" id="authority" name="authority" required> -->
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-success">Add</button>
                        <button type="button" class="btn btn-secondary" onclick="closePopup()">Đóng</button>
                    </div>
                </form>
            </div>
    
    
        
        <div>
            <table class="table table-striped table-bordered table-hover">
                <thead class="table-dark">
                    <tr>
                        <th scope="col">Id</th>
                        <th scope="col">Username</th>
                        <th scope="col">Password</th>
                        <th scope="col">Authority</th>
                        <th scope="col">Actions</th> <!-- Cột mới -->
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="account_user: ${account_users}" th:onclick="'window.location.href=\'/account_user/'+${account_user.id}+'\''">
                        <td th:text="${account_user.id}"></td>
                        <td th:text="${account_user.username}"></td>
                        <td th:text="${account_user.password}"></td>
                        <td th:text="${account_user.authority}"></td>
                        <td>
                            <button class="btn btn-primary btn-sm" onclick="openPopup1(event)">Edit</button>
                            <button class="btn btn-danger btn-sm">Delete</button>
                        </td>
                        <div id="popup1" class="popup">
                            <form th:action="@{/account_user/update/{id}(id=${account_user.id})}" method="post">
                                <div class="mb-3">
                                    <label for="username" class="form-label">Username:</label>
                                    <input type="text" class="form-control" id="username" name="username" th:value="${account_user.username}">
                                </div>
                                <div class="mb-3">
                                    <label for="password" class="form-label">Password:</label>
                                    <input type="password" class="form-control" id="password" name="password" th:value="${account_user.password}" required>
                                </div>
                                <div class="mb-3">
                                    <label for="authority" class="form-label">Authority:</label>
                                    <select id="authority" class="form-control" name="authority">
                                        <option value="ROLE_USER" th:selected="${account_user.authority == 'ROLE_USER'}">ROLE_USER</option>
                                        <option value="ROLE_ADMIN" th:selected="${account_user.authority == 'ROLE_ADMIN'}">ROLE_ADMIN</option>
                                    </select>                    
                                    <!-- <input type="text" class="form-control" id="authority" name="authority" required> -->
                                </div>
                                <div class="text-center">
                                    <button type="submit" class="btn btn-success">Add</button>
                                    <button type="button" class="btn btn-secondary" onclick="closePopup1()">Đóng</button>
                                </div>
                            </form>
                        </div>
                    </tr>
                </tbody>
            </table>
        </div>
  

        <script type="text/javascript" th:src="@{/bootstrap/js/bootstrap.bundle.min.js}"></script>  
        <script type="text/javascript" th:src="@{/custom/js/popup_create.js}"></script>
    </body>
</html>
