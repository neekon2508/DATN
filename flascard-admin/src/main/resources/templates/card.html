<html>
    <head>
        <title>Card</title>
        <link rel="stylesheet" th:href="@{/bootstrap/css/bootstrap.min.css}">
       
        <link rel="stylesheet" th:href="@{/custom/css/popup_create.css}">
   
    </head>

    <body>
        <div th:insert="~{fragments/my_template :: top_menu}"></div>
        <div th:insert="~{fragments/my_template :: search_add}"></div>
        <script>
            document.getElementById("addButton").style.display = "none";
        </script>

        <div>
            <table class="table table-striped table-bordered table-hover">
                <thead class="table-dark">
                    <tr>
                        <th scope="col">Id</th>
                        <th scope="col">CardSet Id</th>
                        <th scope="col">Front Text</th>
                        <th scope="col">Front Image</th> 
                        <th scope="col">Front Sound</th> 
                        <th scope="col">Back Text</th>
                        <th scope="col">Back Image</th> 
                        <th scope="col">Back Sound</th> 
                        <th scope="col">Is Learned</th>
                        <th scope="col">Actions</th> 
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="card: ${cards}">
                        <td th:text="${card.id}"></td>
                        <td th:text="${card.cardSetId}"></td>
                        <td th:text="${card.frontText}"></td>
                        <td th:text="${card.frontImage}"></td>
                        <td th:text="${card.frontSound}"></td>
                        <td th:text="${card.backText}"></td>
                        <td th:text="${card.backImage}"></td>
                        <td th:text="${card.backSound}"></td>
                        <td th:text="${card.isLearned}"></td>
                        <td>
                            <button class="btn btn-primary btn-sm" onclick="openPopup3(event)">Edit</button>
                            <button class="btn btn-danger btn-sm" th:data-url="@{/card/delete/{id}(id=${card.id})}" onclick="confirmDelete(this, event)">Delete</button>
                        </td>
                        <div id="popup3" class="popup">
                            <form th:action="@{/card/update/{id}(id=${card.id})}" method="post" enctype="multipart/form-data">
                                <div class="mb-3">
                                    <label for="username" class="form-label">Front Text:</label>
                                    <input type="text" class="form-control" id="frontText" name="frontText" th:value="${card.frontText}" required>
                                </div>
                                <div class="mb-3">
                                    <label for="username" class="form-label">Front Image:</label>
                                    <input type="file" class="form-control" id="image_of_front" name="image_of_front" accept="image/*">
                                </div>
                                <div class="mb-3">
                                    <label for="username" class="form-label">Front Sound:</label>
                                    <input type="file" class="form-control" id="sound_of_front" name="sound_of_front" accept="audio/*">
                                </div>
                                <div class="mb-3">
                                    <label for="username" class="form-label">Back Text:</label>
                                    <input type="text" class="form-control" id="backText" name="backText" th:value="${card.backText}" required>
                                </div>
                                <div class="mb-3">
                                    <label for="username" class="form-label">Back Image:</label>
                                    <input type="file" class="form-control" id="image_of_back" name="image_of_back" accept="image/*">
                                </div>
                                <div class="mb-3">
                                    <label for="username" class="form-label">Back Sound:</label>
                                    <input type="file" class="form-control" id="sound_of_back" name="sound_of_back" accept="audio/*">
                                </div>
                                <div class="text-center">
                                    <button type="submit" class="btn btn-success">Add</button>
                                    <button type="button" class="btn btn-secondary" onclick="closePopup3()">Đóng</button>
                                </div>
                            </form>
                        </div>
                    </tr>
                </tbody>
            </table>
        </div>
  

        <script type="text/javascript" th:src="@{/bootstrap/js/bootstrap.bundle.min.js}"></script>  
        <script type="text/javascript" th:src="@{/custom/js/popup_create.js}"></script>

    </body>
</html>
