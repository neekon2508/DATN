<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="d-flex justify-content-center align-items-center vh-100">

    <div class="card p-4 shadow-lg" style="width: 350px;">
        <h2 class="text-center">Login</h2>

        <form method="POST" th:action="@{/login}" id="loginForm">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" name="username" id="username" placeholder="Enter 3">
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" name="password" id="password" placeholder="Enter 2">
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>

        <div th:if="${error}" class="alert alert-danger mt-3 text-center">
            Unable to login. Check your username and password.
        </div>
    </div>

</body>
</html>
